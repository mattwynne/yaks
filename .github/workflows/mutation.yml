name: Mutation Testing (Nightly)

on:
  schedule:
    - cron: '0 3 * * *'  # 3am UTC daily
  workflow_dispatch:       # allow manual trigger

jobs:
  mutation-full:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v24
      - uses: cachix/cachix-action@v15
        with:
          name: devenv
      - name: Install cargo-mutants
        run: nix develop --impure --command cargo install cargo-mutants
      - name: Build yx
        run: nix develop --impure --command cargo build --release
      - name: Pull existing yaks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          nix develop --impure --command bin/yx sync
      - name: Run full mutation tests
        run: |
          nix develop --impure --command env CUCUMBER_MODE=in-process \
            YX_SKIP_GIT_CHECKS=1 cargo mutants --in-place || true
      - name: Sync results to yaks
        run: nix develop --impure --command bin/dev mutate-sync
      - name: Push yak changes
        run: nix develop --impure --command bin/yx sync
