name: Publish Stable Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact-name: yx-linux-x86_64.zip
          - os: macos-latest
            target: ""
            artifact-name: yx-macos-aarch64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install musl tools and dependencies (Linux only)
        if: matrix.target != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev linux-libc-dev

      - name: Install musl target (Linux only)
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Install OpenSSL for musl (Linux only)
        if: matrix.target != ''
        run: |
          # Build static OpenSSL for musl
          wget https://www.openssl.org/source/openssl-3.0.13.tar.gz
          tar -xzf openssl-3.0.13.tar.gz
          cd openssl-3.0.13
          # Use -idirafter to add kernel headers after musl's standard headers
          CC=musl-gcc CFLAGS="-idirafter /usr/include/x86_64-linux-gnu -idirafter /usr/include" ./Configure no-shared no-async --prefix=/tmp/musl-openssl --openssldir=/tmp/musl-openssl linux-x86_64
          make -j$(nproc)
          make install_sw
          cd ..

      - name: Build release
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            export OPENSSL_DIR=/tmp/musl-openssl
            export OPENSSL_STATIC=1
            cargo build --release --target ${{ matrix.target }}
            BINARY_PATH=target/${{ matrix.target }}/release/yx
          else
            cargo build --release
            BINARY_PATH=target/release/yx
          fi

          YX_BIN="$BINARY_PATH" bin/check-release "${GITHUB_REF_NAME}"

          mkdir -p release-bundle/bin release-bundle/completions
          cp $BINARY_PATH release-bundle/bin/yx
          chmod +x release-bundle/bin/yx
          cp -r completions/* release-bundle/completions/
          cd release-bundle && zip -r ../${{ matrix.artifact-name }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate release tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Stable releases must be tagged vX.Y.Z; got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          bin/check-release "${GITHUB_REF_NAME}"

      - name: Prepare release notes and installer
        run: |
          bin/changelog-section "${GITHUB_REF_NAME}" > release-notes.md

          LINUX_SUM=$(sha256sum yx-linux-x86_64.zip/yx-linux-x86_64.zip | cut -d' ' -f1)
          MACOS_SUM=$(sha256sum yx-macos-aarch64.zip/yx-macos-aarch64.zip | cut -d' ' -f1)
          echo "Linux checksum: $LINUX_SUM"
          echo "macOS checksum: $MACOS_SUM"
          sed -i "s/^CHECKSUM_LINUX_X86_64=\"\"/CHECKSUM_LINUX_X86_64=\"$LINUX_SUM\"/" install.sh
          sed -i "s/^CHECKSUM_MACOS_AARCH64=\"\"/CHECKSUM_MACOS_AARCH64=\"$MACOS_SUM\"/" install.sh

      - name: Publish stable release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            yx-linux-x86_64.zip/yx-linux-x86_64.zip
            yx-macos-aarch64.zip/yx-macos-aarch64.zip
            install.sh
          prerelease: false
          body_path: release-notes.md
